{% extends "base.html" %}
{% block meta %}
    <title>Edit Experience - {{experience.title}}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="experience-section">
        <div class="container">
            <h1 class="add-project-h1">Edit <span>Experience</span></h1>
            <div class="form-style">

                <form method="POST" 
                    action="{% url 'main:edit_experience' experience.id %}"
                    class="project-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <div class="form-action">
                        <button type="submit" class="button">Simpan perubahan</button>
                        <a href="{% url 'main:show_experience' %}" class="button button-secondary">Batal</a>
    
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
