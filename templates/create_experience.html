{% extends "base.html" %}
{% block meta %}
    <title>Add Experience - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="experience-section">
            <div class="container">
                <h1 class="add-project-h1">Add New <span>Experience</span></h1>
                <div class="form-style">

                    <form method="post"
                        action="{% url 'main:create_experience' %}"
                        class="project-form">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="form-group">
                                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                                {{ field }}
                                {% for error in field.errors %}
                                    <p class="form-error">{{ error }}</p>
                                {% endfor %}
                            </div>
                        {% endfor %}
                        <div class="form-action">
                            <button type="submit" class="button">Tambah Pengalaman</button>
                            <a href="{% url 'main:show_experience' %}" class="button button-secondary">Batal</a>
    
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
